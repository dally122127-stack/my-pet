<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>雙人桌寵動態實驗室 - 物理焊死版</title>
    <style>
        body { margin: 0; overflow: hidden; background: transparent; }
        .pet-container { position: absolute; width: 128px; height: 128px; z-index: 10; }
        .hug-container { position: absolute; width: 256px; height: 128px; z-index: 20; display: none; aspect-ratio: auto; }
        .pet-img { width: auto; height: 100%; cursor: grab; user-select: none; }
        .pet-img:active { cursor: grabbing; }
        .heart-effect {
            position: absolute; width: 32px; height: 32px;
            pointer-events: none; animation: floatUp 1.2s ease-out forwards;
        }
        @keyframes floatUp {
            0% { transform: translateY(0) scale(0.6); opacity: 0; }
            20% { opacity: 1; }
            100% { transform: translateY(-60px) scale(1.1); opacity: 0; }
        }
    </style>
</head>
<body>

    <!-- 建立隱藏的雙人合體互動舞台 -->
    <div id="hug-stage" class="hug-container">
        <img id="hug-img" class="pet-img" src="meet1_face.png" alt="擁抱互動">
    </div>

    <script>
        const petsData = [
            { folder: 'Takumi', sleepBreaths: 18 },
            { folder: 'Aotsuki', sleepBreaths: 6 }
        ];
        const activePets = [];
        const hugStage = document.getElementById('hug-stage');
        const hugImg = document.getElementById('hug-img');
        let isHuggingGlobal = false;

        // 🎯 核心修復：在最頂層建立完全分開的兩個全域專屬記憶庫，杜絕後台覆蓋錯位
        let petX0 = 100, petY0 = 200;
        let petX1 = 400, petY1 = 200;
        let isDragging0 = false, isDragging1 = false;
        let petState0 = 'walk', petState1 = 'walk';
        // 初始化與控制每個角色的常規動態
        petsData.forEach(function(petConfig, index) {
            const folderName = petConfig.folder;
            const myMaxSleepBreaths = petConfig.sleepBreaths;

            const container = document.createElement('div');
            container.className = 'pet-container';
            // 🎯 核心修復：幫每個角色打上絕對不變的身分證 ID 標籤！
            container.id = 'pet-id-' + index; 
            
            const petImg = document.createElement('img');
            petImg.className = 'pet-img';
            petImg.alt = folderName;
            container.appendChild(petImg);
            document.body.appendChild(container);

            let imgStandL = folderName + '/shime1.png';
            let imgStandR = folderName + '/shime1_r.png';
            let imgDrag = folderName + '/drag.png'; 
            let walkFramesL = [folderName + '/shime2.png', folderName + '/shime3.png'];
            let walkFramesR = [folderName + '/shime2_r.png', folderName + '/shime3_r.png'];
            let imgSitIn = folderName + '/sit_in.png';
            let imgSitOut = folderName + '/sit_out.png';
            let imgSitInR = folderName + '/sit_in_r.png';
            let imgSitOutR = folderName + '/sit_out_r.png';
            let imgStandUp = folderName + '/stand_up.png';
            let imgSleepDown = folderName + '/sleep_down.png';
            let imgSleepIn = folderName + '/sleep_in.png';
            let imgSleepOut = folderName + '/sleep_out.png';
            let imgSleepUp = folderName + '/sleep_up.png';
            
            let startX = 0, startY = 0;
            let currentFrameIndex = 0; 
            let walkDirection = (index === 0) ? 1 : -1;
            let breathCount = 0; 
            const maxBreaths = 3;

            petImg.src = imgStandL;
            container.style.top = '200px';
            if(index === 0) { container.style.left = petX0 + 'px'; } else { container.style.left = petX1 + 'px'; }

            // 每 0.4 秒執行一次的動作計時器
            setInterval(function() {
                let myIsD = (index === 0) ? isDragging0 : isDragging1;
                if (myIsD || isHuggingGlobal) { return; }
                
                let myState = (index === 0) ? petState0 : petState1;
                let myX = (index === 0) ? petX0 : petX1;

                if (myState === 'walk') {
                    if (Math.random() < 0.8) { 
                        if (Math.random() < 0.15) { walkDirection = (walkDirection === -1) ? 1 : -1; }
                        myX += walkDirection * 12;
                        if (myX < 0) { myX = 0; walkDirection = 1; }
                        if (myX > window.innerWidth - 128) { myX = window.innerWidth - 128; walkDirection = -1; }
                        
                        container.style.left = myX + 'px';
                        if(index === 0) { petX0 = myX; } else { petX1 = myX; }
                        
                        currentFrameIndex = (currentFrameIndex + 1) % walkFramesL.length;
                        if (walkDirection === -1) {
                            checkImageExists(walkFramesL[currentFrameIndex], function() { petImg.src = walkFramesL[currentFrameIndex]; }, function() { petImg.src = imgStandL; });
                        } else {
                            checkImageExists(walkFramesR[currentFrameIndex], function() { petImg.src = walkFramesR[currentFrameIndex]; }, function() { petImg.src = imgStandR; });
                        }
                        petImg.style.transform = 'none'; 
                        
                        // 擁抱觸發雷達：直接比對最頂層的全域變數，杜絕指針偏移
                        if (index === 0) {
                            let dist = Math.abs(petX0 - petX1);
                            if (dist < 100 && isDragging0 === false && isDragging1 === false) { triggerHugEvent(); }
                        }
                    } else {
                        if (Math.random() < 0.25) { 
                            if (Math.random() < 0.5) {
                                if(index === 0) { petState0 = 'rest_sit'; } else { petState1 = 'rest_sit'; }
                                breathCount = 0;
                                let startSit = (walkDirection === -1) ? imgSitIn : imgSitInR;
                                let startSitBackup = (walkDirection === -1) ? imgStandL : imgStandR;
                                checkImageExists(startSit, function() { petImg.src = startSit; }, function() { petImg.src = startSitBackup; });
                            } else {
                                if(index === 0) { petState0 = 'rest_sleep'; } else { petState1 = 'rest_sleep'; }
                                breathCount = 0; checkImageExists(imgSleepDown, function() { petImg.src = imgSleepDown; }, function() { petImg.src = imgStandL; });
                            }
                        } else {
                            petImg.src = (walkDirection === -1) ? imgStandL : imgStandR; petImg.style.transform = 'none';
                        }
                    }
                }
                else if (myState === 'rest_sit') {
                    if (breathCount < maxBreaths * 2) {
                        let curSitIn = (walkDirection === -1) ? imgSitIn : imgSitInR;
                        let curSitOut = (walkDirection === -1) ? imgSitOut : imgSitOutR;
                        let curSitBackup = (walkDirection === -1) ? imgStandL : imgStandR;
                        if (breathCount % 2 === 0) { checkImageExists(curSitOut, function() { petImg.src = curSitOut; }, function() { petImg.src = curSitBackup; }); } 
                        else { checkImageExists(curSitIn, function() { petImg.src = curSitIn; }, function() { petImg.src = curSitBackup; }); }
                        breathCount++;
                    } else {
                        if(index === 0) { petState0 = 'get_up'; } else { petState1 = 'get_up'; }
                        checkImageExists(imgStandUp, function() { petImg.src = imgStandUp; }, function() { petImg.src = imgStandL; });
                    }
                }
                else if (myState === 'rest_sleep') {
                    if (breathCount === 0) { checkImageExists(imgSleepDown, function() { petImg.src = imgSleepDown; }, function() { petImg.src = imgStandL; }); breathCount++; } 
                    else if (breathCount <= myMaxSleepBreaths) {
                        if (breathCount % 2 === 0) { checkImageExists(imgSleepOut, function() { petImg.src = imgSleepOut; }, function() { petImg.src = imgStandL; }); } 
                        else { checkImageExists(imgSleepIn, function() { petImg.src = imgSleepIn; }, function() { petImg.src = imgStandL; }); }
                        breathCount++;
                    } else { 
                        if(index === 0) { petState0 = 'wake_up'; } else { petState1 = 'wake_up'; }
                        checkImageExists(imgSleepUp, function() { petImg.src = imgSleepUp; }, function() { petImg.src = imgStandL; }); 
                    } 
                }
                else if (myState === 'get_up' || myState === 'wake_up') {
                    if(index === 0) { petState0 = 'walk'; } else { petState1 = 'walk'; }
                    petImg.src = (walkDirection === -1) ? imgStandL : imgStandR;
                }
            }, 400);

            // 滑鼠抓取互動
            petImg.addEventListener('mousedown', function(e) {
                if (isHuggingGlobal) { return; }
                if(index === 0) { isDragging0 = true; petState0 = 'walk'; } else { isDragging1 = true; petState1 = 'walk'; }
                checkImageExists(imgDrag, function() { petImg.src = imgDrag; }, function() { petImg.src = (walkDirection === -1) ? (folderName + '/shime3.png') : (folderName + '/shime3_r.png'); });
                let currentX = (index === 0) ? petX0 : petX1; let currentY = (index === 0) ? petY0 : petY1;
                startX = e.clientX - currentX; startY = e.clientY - currentY; spawnHeart(container, folderName);
            });
            document.addEventListener('mousemove', function(e) {
                let myIsD = (index === 0) ? isDragging0 : isDragging1;
                if (myIsD) {
                    let targetX = e.clientX - startX; let targetY = e.clientY - startY;
                    container.style.left = targetX + 'px'; container.style.top = targetY + 'px';
                    if(index === 0) { petX0 = targetX; petY0 = targetY; } else { petX1 = targetX; petY1 = targetY; }
                }
            });
            document.addEventListener('mouseup', function() { 
                if(index === 0) { isDragging0 = false; } else { isDragging1 = false; }
                petImg.src = (walkDirection === -1) ? imgStandL : imgStandR; 
            });
        });
        // 🎬 全自動雙向擁抱導演系統（身分證 ID 死命令版）
        function triggerHugEvent() {
            isHuggingGlobal = true;
            
            // 直接抓取網頁的實體 HTML 元件，斷開任何後台物件的暫存記憶覆蓋
            const elementPet0 = document.getElementById('pet-id-0');
            const elementPet1 = document.getElementById('pet-id-1');
            
            // 計算兩個角色的絕對正中心點
            let midX = (petX0 + petX1) / 2 + 0; 
            let midY = (petY0 + petY1) / 2;
            
            // 直接對準網頁實體下達隱形命令
            if(elementPet0) elementPet0.style.display = 'none';
            if(elementPet1) elementPet1.style.display = 'none';
            
            // 呼叫擁抱合體舞台
            hugStage.style.left = midX + 'px';
            hugStage.style.top = midY + 'px';
            hugStage.style.display = 'block';
            
            let prefix = (Math.random() < 0.5) ? '' : 'r_';
            
            // 順暢更換 5 張手繪分鏡圖
            setTimeout(function() { hugImg.src = prefix + 'meet1_face.png'; }, 0);       
            setTimeout(function() { hugImg.src = prefix + 'meet2_walk.png'; }, 1000);    
            setTimeout(function() { 
                hugImg.src = prefix + 'meet3_hug.png';                             
                spawnHeart(hugStage, 'Takumi'); spawnHeart(hugStage, 'Aotsuki');
            }, 2200);
            setTimeout(function() { hugImg.src = prefix + 'meet4_separate.png'; }, 4200); 
            setTimeout(function() { hugImg.src = prefix + 'meet5_shy.png'; }, 5400);     
            
            // 🎬 7 秒劇場時間到，強制原地歸位解散
            setTimeout(function() {
                hugStage.style.display = 'none';
                
                // 🎯 終極防線：直接灌入最頂層的全域變數，洗掉所有偷跑的距離
                petX0 = midX - 40;
                petY0 = midY;
                petX1 = midX + 160;
                petY1 = midY;
                
                // 🎯 終極防線：對準身分證 ID 直接下達死命令，強制把他們的身體焊在原地！
                if(elementPet0) {
                    elementPet0.style.left = petX0 + 'px';
                    elementPet0.style.top = petY0 + 'px';
                    elementPet0.style.display = 'block';
                }
                if(elementPet1) {
                    elementPet1.style.left = petX1 + 'px';
                    elementPet1.style.top = petY1 + 'px';
                    elementPet1.style.display = 'block';
                }
                
                // 完全重置所有人狀態
                petState0 = 'walk';
                petState1 = 'walk';
                isDragging0 = false;
                isDragging1 = false;
                isHuggingGlobal = false; 
            }, 7000);
        }

        function checkImageExists(url, success, error) { const img = new Image(); img.onload = success; img.onerror = error; img.src = url; }
        function spawnHeart(parentContainer, folder) {
            const heart = document.createElement('img');
            heart.src = folder + '/heart.png'; heart.className = 'heart-effect';
            heart.style.left = (Math.random() * 160 + 40) + 'px'; heart.style.top = '40px'; 
            checkImageExists(heart.src, function() { parentContainer.appendChild(heart); setTimeout(function() { heart.remove(); }, 1200); }, function() {});
        }
    </script>
</body>
</html>
