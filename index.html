<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>雙人桌寵動態實驗室 - 安全經典版</title>
    <style>
        body { margin: 0; overflow: hidden; background: transparent; }
        .pet-container { position: absolute; width: 128px; height: 128px; z-index: 10; }
        .hug-container { position: absolute; width: 256px; height: 128px; z-index: 20; display: none; aspect-ratio: auto; }
        .pet-img { width: auto; height: 100%; cursor: grab; user-select: none; }
        .pet-img:active { cursor: grabbing; }
        .heart-effect {
            position: absolute; width: 32px; height: 32px;
            pointer-events: none; animation: floatUp 1.2s ease-out forwards;
        }
        @keyframes floatUp {
            0% { transform: translateY(0) scale(0.6); opacity: 0; }
            20% { opacity: 1; }
            100% { transform: translateY(-60px) scale(1.1); opacity: 0; }
        }
    </style>
</head>
<body>

    <!-- 建立隱藏的雙人合體互動舞台 -->
    <div id="hug-stage" class="hug-container">
        <img id="hug-img" class="pet-img" src="meet1_face.png" alt="擁抱互動">
    </div>

    <script>
        // 🎨 角色獨立設定區（Takumi 呼吸 12 下、Aotsuki 呼吸 6 下）
        const petsData = [
            { folder: 'Takumi', sleepBreaths: 12 },
            { folder: 'Aotsuki', sleepBreaths: 6 }
        ];
        const activePets = [];
        const hugStage = document.getElementById('hug-stage');
        const hugImg = document.getElementById('hug-img');
        let isHuggingGlobal = false;
        // 初始化與常規動作系統
        petsData.forEach(function(petConfig, index) {
            const folderName = petConfig.folder;
            const myMaxSleepBreaths = petConfig.sleepBreaths;

            const container = document.createElement('div');
            container.className = 'pet-container';
            const petImg = document.createElement('img');
            petImg.className = 'pet-img';
            petImg.alt = folderName;
            container.appendChild(petImg);
            document.body.appendChild(container);

            let imgStandL = folderName + '/shime1.png';
            let imgStandR = folderName + '/shime1_r.png';
            let imgDrag = folderName + '/drag.png'; 
            let walkFramesL = [folderName + '/shime2.png', folderName + '/shime3.png'];
            let walkFramesR = [folderName + '/shime2_r.png', folderName + '/shime3_r.png'];
            
            let imgSitIn = folderName + '/sit_in.png';
            let imgSitOut = folderName + '/sit_out.png';
            let imgSitInR = folderName + '/sit_in_r.png';
            let imgSitOutR = folderName + '/sit_out_r.png';
            let imgStandUp = folderName + '/stand_up.png';
            
            let imgSleepDown = folderName + '/sleep_down.png';
            let imgSleepIn = folderName + '/sleep_in.png';
            let imgSleepOut = folderName + '/sleep_out.png';
            let imgSleepUp = folderName + '/sleep_up.png';
            
            let isDragging = false; 
            let startX = 0, startY = 0;
            let petObj = { x: 100 + (index * 300), y: 200 };
            let currentFrameIndex = 0; 
            let walkDirection = (index === 0) ? 1 : -1;
            let petState = 'walk'; 
            let breathCount = 0; 
            const maxBreaths = 3;

            petImg.src = imgStandL;
            container.style.left = petObj.x + 'px'; 
            container.style.top = petObj.y + 'px';

            activePets.push({
                container: container,
                petImg: petImg,
                pos: petObj,
                reset: function() {
                    isDragging = false;
                    petState = 'walk';
                    container.style.display = 'block';
                }
            });

            // 散步與休息定時器
            setInterval(function() {
                if (isDragging || isHuggingGlobal) { return; }
                
                if (petState === 'walk') {
                    if (Math.random() < 0.8) { 
                        if (Math.random() < 0.15) { walkDirection = (walkDirection === -1) ? 1 : -1; }
                        petObj.x += walkDirection * 12;
                        if (petObj.x < 0) { petObj.x = 0; walkDirection = 1; }
                        if (petObj.x > window.innerWidth - 128) { petObj.x = window.innerWidth - 128; walkDirection = -1; }
                        container.style.left = petObj.x + 'px';
                        
                        currentFrameIndex = (currentFrameIndex + 1) % walkFramesL.length;
                        if (walkDirection === -1) {
                            checkImageExists(walkFramesL[currentFrameIndex], function() { petImg.src = walkFramesL[currentFrameIndex]; }, function() { petImg.src = imgStandL; });
                        } else {
                            checkImageExists(walkFramesR[currentFrameIndex], function() { petImg.src = walkFramesR[currentFrameIndex]; }, function() { petImg.src = imgStandR; });
                        }
                        petImg.style.transform = 'none'; 
                        
                        // 擁抱觸發雷達
                        if (index === 0 && activePets.length === 2) {
                            let dist = Math.abs(activePets[0].pos.x - activePets[1].pos.x);
                            if (dist < 100 && Math.random() < 0.4) {
                                triggerHugEvent();
                            }
                        }
                    } else {
                        if (Math.random() < 0.25) { 
                            if (Math.random() < 0.4) {
                                // 🎲 進入「微笑呼吸循環」
                                petState = 'smile_breath'; breathCount = 0;
                                let smileImg = (walkDirection === -1) ? (folderName + '/smile_in.png') : (folderName + '/smile_in_r.png');
                                checkImageExists(smileImg, function() { petImg.src = smileImg; }, function() { petImg.src = imgStandL; });
                            } else if (Math.random() < 0.5) {
                                petState = 'rest_sit'; breathCount = 0;
                                let startSit = (walkDirection === -1) ? imgSitIn : imgSitInR;
                                let startSitBackup = (walkDirection === -1) ? imgStandL : imgStandR;
                                checkImageExists(startSit, function() { petImg.src = startSit; }, function() { petImg.src = startSitBackup; });
                            } else {
                                petState = 'rest_sleep'; breathCount = 0;
                                let startSleep = (walkDirection === -1) ? imgSleepDown : (folderName + '/sleep_down_r.png');
                                checkImageExists(startSleep, function() { petImg.src = startSleep; }, function() { petImg.src = imgStandL; });
                            }
                        } else {
                            petImg.src = (walkDirection === -1) ? imgStandL : imgStandR;
                            petImg.style.transform = 'none';
                        }
                    }
                }
                else if (petState === 'smile_breath') {
                    let sIn = (walkDirection === -1) ? (folderName + '/smile_in.png') : (folderName + '/smile_in_r.png');
                    let sOut = (walkDirection === -1) ? (folderName + '/smile_out.png') : (folderName + '/smile_out_r.png');
                    let sBackup = (walkDirection === -1) ? imgStandL : imgStandR;
                    if (breathCount < 6) {
                        if (breathCount % 2 === 0) { checkImageExists(sOut, function() { petImg.src = sOut; }, function() { petImg.src = sBackup; }); }
                        else { checkImageExists(sIn, function() { petImg.src = sIn; }, function() { petImg.src = sBackup; }); }
                        breathCount++;
                    } else {
                        petState = 'walk';
                        petImg.src = (walkDirection === -1) ? imgStandL : imgStandR;
                    }
                }
                else if (petState === 'rest_sit') {
                    if (breathCount < maxBreaths * 2) {
                        let curSitIn = (walkDirection === -1) ? imgSitIn : imgSitInR;
                        let curSitOut = (walkDirection === -1) ? imgSitOut : imgSitOutR;
                        let curSitBackup = (walkDirection === -1) ? imgStandL : imgStandR;
                        if (breathCount % 2 === 0) { checkImageExists(curSitOut, function() { petImg.src = curSitOut; }, function() { petImg.src = curSitBackup; }); } 
                        else { checkImageExists(curSitIn, function() { petImg.src = curSitIn; }, function() { petImg.src = curSitBackup; }); }
                        breathCount++;
                    } else {
                        petState = 'get_up';
                        checkImageExists(imgStandUp, function() { petImg.src = imgStandUp; }, function() { petImg.src = imgStandL; });
                    }
                }
                // 擴充 Aotsuki / Takumi 個性化睡眠
                else if (petState === 'rest_sleep') {
                    let curSleepD = (walkDirection === -1) ? imgSleepDown : (folderName + '/sleep_down_r.png');
                    let curSleepIn = (walkDirection === -1) ? imgSleepIn : (folderName + '/sleep_in_r.png');
                    let curSleepOut = (walkDirection === -1) ? imgSleepOut : (folderName + '/sleep_out.png');
                    let curSleepUp = (walkDirection === -1) ? imgSleepUp : (folderName + '/sleep_up.png');
                    let curSleepBackup = (walkDirection === -1) ? imgStandL : imgStandR;

                    if (breathCount === 0) {
                        checkImageExists(curSleepD, function() { petImg.src = curSleepD; }, function() { petImg.src = curSleepBackup; }); breathCount++;
                    } else if (breathCount <= myMaxSleepBreaths) {
                        if (breathCount % 2 === 0) { checkImageExists(curSleepOut, function() { petImg.src = curSleepOut; }, function() { petImg.src = curSleepBackup; }); } 
                        else { checkImageExists(curSleepIn, function() { petImg.src = curSleepIn; }, function() { petImg.src = curSleepBackup; }); }
                        breathCount++;
                    } else {
                        petState = 'wake_up';
                        checkImageExists(curSleepUp, function() { petImg.src = curSleepUp; }, function() { petImg.src = curSleepBackup; });
                    } 
                }
                else if (petState === 'get_up' || petState === 'wake_up') {
                    petState = 'walk';
                    petImg.src = (walkDirection === -1) ? imgStandL : imgStandR;
                }
            }, 400);
            // 滑鼠抓取
            petImg.addEventListener('mousedown', function(e) {
                if (isHuggingGlobal) { return; }
                isDragging = true; petState = 'walk';
                checkImageExists(imgDrag, function() { petImg.src = imgDrag; }, function() { petImg.src = (walkDirection === -1) ? (folderName + '/shime3.png') : (folderName + '/shime3_r.png'); });
                startX = e.clientX - petObj.x; startY = e.clientY - petObj.y;
                spawnHeart(container, folderName);
            });
            document.addEventListener('mousemove', function(e) {
                if (isDragging) {
                    petObj.x = e.clientX - startX; petObj.y = e.clientY - startY;
                    container.style.left = petObj.x + 'px'; container.style.top = petObj.y + 'px';
                }
            });
            document.addEventListener('mouseup', function() { 
                if (isDragging) { isDragging = false; petImg.src = (walkDirection === -1) ? imgStandL : imgStandR; } 
            });
        });

        // 🎬 全自動雙向擁抱導演系統（經典流暢版：保留原位移錯誤以換取穩定度）
        function triggerHugEvent() {
            isHuggingGlobal = true;
            
            const p1 = activePets[0];
            const p2 = activePets[1];
            
            let midX = (p1.pos.x + p2.pos.x) / 2; 
            let midY = (p1.pos.y + p2.pos.y) / 2;
            
            p1.container.style.display = 'none';
            p2.container.style.display = 'none';
            
            hugStage.style.left = (midX - 64) + 'px'; 
            hugStage.style.top = midY + 'px';
            hugStage.style.display = 'block';
            
            let prefix = (Math.random() < 0.5) ? '' : 'r_';
            
            setTimeout(function() { hugImg.src = prefix + 'meet1_face.png'; }, 0);       
            setTimeout(function() { hugImg.src = prefix + 'meet2_walk.png'; }, 1000);    
            setTimeout(function() { 
                hugImg.src = prefix + 'meet3_hug.png';                             
                spawnHeart(hugStage, 'Takumi'); spawnHeart(hugStage, 'Aotsuki');
            }, 2200);
            setTimeout(function() { hugImg.src = prefix + 'meet4_separate.png'; }, 4200); 
            setTimeout(function() { hugImg.src = prefix + 'meet5_shy.png'; }, 5400);     
            
            // 7 秒結束後解散，回歸最簡單、絕不當機的經典邏輯
            setTimeout(function() {
                hugStage.style.display = 'none';
                
                // 退回經典安全版：允許他們用記憶體位置彈開，換取兩隻角色絕對不會消失！
                p1.pos.x = midX - 60;
                p2.pos.x = midX + 60;
                
                p1.reset();
                p2.reset();
                isHuggingGlobal = false; 
            }, 7000);
        }

        function checkImageExists(url, success, error) { const img = new Image(); img.onload = success; img.onerror = error; img.src = url; }
        function spawnHeart(parentContainer, folder) {
            const heart = document.createElement('img');
            heart.src = folder + '/heart.png'; heart.className = 'heart-effect';
            heart.style.left = (Math.random() * 160 + 40) + 'px'; heart.style.top = '40px'; 
            checkImageExists(heart.src, function() { parentContainer.appendChild(heart); setTimeout(function() { heart.remove(); }, 1200); }, function() {});
        }
    </script>
</body>
</html>
