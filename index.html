<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>雙人桌寵動態實驗室 - Takumi 造型</title>
    <style>
        body { margin: 0; overflow: hidden; background: transparent; }
        #pet-container { position: absolute; width: 128px; height: 128px; }
        #pet { width: 100%; height: 100%; cursor: grab; user-select: none; transition: transform 0.1s; }
        #pet:active { cursor: grabbing; }
        .heart-effect {
            position: absolute; width: 32px; height: 32px;
            pointer-events: none; animation: floatUp 1.2s ease-out forwards;
        }
        @keyframes floatUp {
            0% { transform: translateY(0) scale(0.6); opacity: 0; }
            20% { opacity: 1; }
            100% { transform: translateY(-60px) scale(1.1); opacity: 0; }
        }
    </style>
</head>
<body>
    <div id="pet-container">
        <img id="pet" src="" alt="桌寵">
    </div>

    <script>
        // ==========================================
        // 🎨 繪師專用設定區：資料夾名稱已更新為 Takumi
        const folderName = 'Takumi'; 
        // ==========================================

        const container = document.getElementById('pet-container');
        const pet = document.getElementById('pet');
        let isDragging = false, startX, startY, petX = 150, petY = 150;
        
        // 自動動態組合路徑，對齊你上傳的 shime1, shime2, shime3
        let imgStand = `${folderName}/shime1.png`;
        let imgDrag = `${folderName}/shime3.png`;
        let walkFrames = [`${folderName}/shime2.png`, `${folderName}/shime3.png`];
        
        let currentFrameIndex = 0;
        let walkDirection = 1;

        // 預設載入發呆圖
        pet.src = imgStand;
        container.style.left = petX + 'px'; container.style.top = petY + 'px';

        // 核心動態定時器
        setInterval(() => {
            if (!isDragging) {
                if (Math.random() < 0.7) {
                    if (Math.random() < 0.15) { walkDirection = walkDirection === 1 ? -1 : 1; }
                    petX += walkDirection * 15;
                    if (petX < 0) { petX = 0; walkDirection = 1; }
                    if (petX > window.innerWidth - 128) { petX = window.innerWidth - 128; walkDirection = -1; }
                    container.style.left = petX + 'px';
                    
                    currentFrameIndex = (currentFrameIndex + 1) % walkFrames.length;
                    pet.src = walkFrames[currentFrameIndex];
                    pet.style.transform = walkDirection === 1 ? 'scaleX(-1)' : 'scaleX(1)';
                    if (Math.random() < 0.2) { spawnHeart(); }
                } else {
                    pet.src = imgStand;
                }
            }
        }, 400);

        function spawnHeart() {
            const heart = document.createElement('img');
            // 這裡會自動去抓 Takumi 資料夾裡的 heart.png
            heart.src = `${folderName}/heart.png`; 
            heart.className = 'heart-effect';
            heart.style.left = (45 + (Math.random() - 0.5) * 30) + 'px';
            heart.style.top = '-10px';
            container.appendChild(heart);
            setTimeout(() => { heart.remove(); }, 1200);
        }

        // 滑鼠互動
        pet.addEventListener('mousedown', (e) => {
            isDragging = true; 
            pet.src = imgDrag; 
            startX = e.clientX - petX; startY = e.clientY - petY;
            spawnHeart();
        });
        document.addEventListener('mousemove', (e) => {
            if (isDragging) {
                petX = e.clientX - startX; petY = e.clientY - startY;
                container.style.left = petX + 'px'; container.style.top = petY + 'px';
            }
        });
        document.addEventListener('mouseup', () => {
            if (isDragging) { isDragging = false; pet.src = imgStand; }
        });
    </script>
</body>
</html>
