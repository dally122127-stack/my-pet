<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>雙人桌寵動態實驗室</title>
    <style>
        body { margin: 0; overflow: hidden; background: transparent; }
        .pet-container { position: absolute; width: 128px; height: 128px; z-index: 10; }
        .hug-container { position: absolute; width: 256px; height: 128px; z-index: 20; display: none; aspect-ratio: auto; }
        .pet-img { width: auto; height: 100%; cursor: grab; user-select: none; }
        .pet-img:active { cursor: grabbing; }
        .heart-effect {
            position: absolute; width: 32px; height: 32px;
            pointer-events: none; animation: floatUp 1.2s ease-out forwards;
        }
        @keyframes floatUp {
            0% { transform: translateY(0) scale(0.6); opacity: 0; }
            20% { opacity: 1; }
            100% { transform: translateY(-60px) scale(1.1); opacity: 0; }
        }
    </style>
</head>
<body>

    <!-- 建立隱藏的雙人合體互動舞台 -->
    <div id="hug-stage" class="hug-container">
        <img id="hug-img" class="pet-img" src="meet1_face.png" alt="擁抱互動">
    </div>

    <script>
        // 🎨 角色獨立設定區
        const petsData = [
            { folder: 'Takumi', sleepBreaths: 18 },
            { folder: 'Aotsuki', sleepBreaths: 6 }
        ];
        const activePets = [];
        
        const hugStage = document.getElementById('hug-stage');
        const hugImg = document.getElementById('hug-img');
        let isHuggingGlobal = false;
        // 初始化與控制每個角色的常規動態
        petsData.forEach(function(petConfig, index) {
            const folderName = petConfig.folder;
            const myMaxSleepBreaths = petConfig.sleepBreaths;

            const container = document.createElement('div');
            container.className = 'pet-container';
            const petImg = document.createElement('img');
            petImg.className = 'pet-img';
            petImg.alt = folderName;
            container.appendChild(petImg);
            document.body.appendChild(container);

            let imgStandL = folderName + '/shime1.png';
            let imgStandR = folderName + '/shime1_r.png';
            let imgDrag = folderName + '/drag.png'; 
            let walkFramesL = [folderName + '/shime2.png', folderName + '/shime3.png'];
            let walkFramesR = [folderName + '/shime2_r.png', folderName + '/shime3_r.png'];
            let imgSitIn = folderName + '/sit_in.png';
            let imgSitOut = folderName + '/sit_out.png';
            let imgStandUp = folderName + '/stand_up.png';
            let imgSleepDown = folderName + '/sleep_down.png';
            let imgSleepIn = folderName + '/sleep_in.png';
            let imgSleepOut = folderName + '/sleep_out.png';
            let imgSleepUp = folderName + '/sleep_up.png';
            
            let isDragging = false; 
            let startX = 0, startY = 0;
            let petX = 100 + (index * 300); 
            let petY = 200;
            let currentFrameIndex = 0; 
            let walkDirection = (index === 0) ? 1 : -1;
            let petState = 'walk'; 
            let breathCount = 0; 
            const maxBreaths = 3;

            petImg.src = imgStandL;
            container.style.left = petX + 'px'; 
            container.style.top = petY + 'px';

            activePets.push({ 
                container: container, 
                petImg: petImg, 
                data: { 
                    getX: function() { return petX; }, 
                    setX: function(v) { petX = v; container.style.left = v + 'px'; }, 
                    getY: function() { return petY; }, 
                    setY: function(v) { petY = v; container.style.top = v + 'px'; }, 
                    getIsDragging: function() { return isDragging; }, 
                    setHide: function(h) { container.style.display = h ? 'none' : 'block'; }, 
                    resetState: function() { petState = 'walk'; } 
                } 
            });

            // 動作切換計時器
            setInterval(function() {
                if (isDragging || isHuggingGlobal) { return; }
                
                if (petState === 'walk') {
                    if (Math.random() < 0.8) { 
                        if (Math.random() < 0.15) { walkDirection = (walkDirection === -1) ? 1 : -1; }
                        petX += walkDirection * 12;
                        if (petX < 0) { petX = 0; walkDirection = 1; }
                        if (petX > window.innerWidth - 128) { petX = window.innerWidth - 128; walkDirection = -1; }
                        container.style.left = petX + 'px';
                        
                        currentFrameIndex = (currentFrameIndex + 1) % walkFramesL.length;
                        if (walkDirection === -1) {
                            checkImageExists(walkFramesL[currentFrameIndex], function() { petImg.src = walkFramesL[currentFrameIndex]; }, function() { petImg.src = imgStandL; });
                        } else {
                            checkImageExists(walkFramesR[currentFrameIndex], function() { petImg.src = walkFramesR[currentFrameIndex]; }, function() { petImg.src = imgStandR; });
                        }
                        petImg.style.transform = 'none'; 
                        
                        // 擁抱觸發雷達
                        if (index === 0 && activePets.length === 2) {
                            const p1 = activePets[0];
                            const p2 = activePets[1];
                            let dist = Math.abs(p1.data.getX() - p2.data.getX());
                            if (dist < 100 && !p1.data.getIsDragging() && !p2.data.getIsDragging() && Math.random() < 0.4) {
                                triggerHugEvent();
                            }
                        }
                    } else {
                        if (Math.random() < 0.25) { 
                            if (Math.random() < 0.5) {
                                petState = 'rest_sit'; breathCount = 0; checkImageExists(imgSitIn, function() { petImg.src = imgSitIn; }, function() { petImg.src = imgStandL; });
                            } else {
                                petState = 'rest_sleep'; breathCount = 0; checkImageExists(imgSleepDown, function() { petImg.src = imgSleepDown; }, function() { petImg.src = imgStandL; });
                            }
                        } else {
                            if (walkDirection === -1) { petImg.src = imgStandL; } else { petImg.src = imgStandR; }
                            petImg.style.transform = 'none';
                        }
                    }
                }
                else if (petState === 'rest_sit') {
                    if (breathCount < maxBreaths * 2) {
                        if (breathCount % 2 === 0) {
                            checkImageExists(imgSitOut, function() { petImg.src = imgSitOut; }, function() { petImg.src = imgStandL; });
                        } else {
                            checkImageExists(imgSitIn, function() { petImg.src = imgSitIn; }, function() { petImg.src = imgStandL; });
                        }
                        breathCount++;
                    } else {
                        petState = 'get_up';
                        checkImageExists(imgStandUp, function() { petImg.src = imgStandUp; }, function() { petImg.src = imgStandL; });
                    }
                }
                else if (petState === 'rest_sleep') {
                    if (breathCount === 0) {
                        checkImageExists(imgSleepDown, function() { petImg.src = imgSleepDown; }, function() { petImg.src = imgStandL; });
                        breathCount++;
                    } else if (breathCount <= myMaxSleepBreaths) {
                        if (breathCount % 2 === 0) {
                            checkImageExists(imgSleepOut, function() { petImg.src = imgSleepOut; }, function() { petImg.src = imgStandL; });
                        } else {
                            checkImageExists(imgSleepIn, function() { petImg.src = imgSleepIn; }, function() { petImg.src = imgStandL; });
                        }
                        breathCount++;
                    } else {
                        petState = 'wake_up';
                        checkImageExists(imgSleepUp, function() { petImg.src = imgSleepUp; }, function() { petImg.src = imgStandL; });
                    } 
                }
                else if (petState === 'get_up' || petState === 'wake_up') {
                    petState = 'walk';
                    petImg.src = (walkDirection === -1) ? imgStandL : imgStandR;
                }
            }, 400);

            // 滑鼠互動
            petImg.addEventListener('mousedown', function(e) {
                if (isHuggingGlobal) { return; }
                isDragging = true; 
                petState = 'walk';
                checkImageExists(imgDrag, function() { petImg.src = imgDrag; }, function() { petImg.src = (walkDirection === -1) ? (folderName + '/shime3.png') : (folderName + '/shime3_r.png'); });
                startX = e.clientX - petX; 
                startY = e.clientY - petY;
                spawnHeart(container, folderName);
            });
            document.addEventListener('mousemove', function(e) {
                if (isDragging) {
                    petX = e.clientX - startX; 
                    petY = e.clientY - startY;
                    container.style.left = petX + 'px'; 
                    container.style.top = petY + 'px';
                }
            });
            document.addEventListener('mouseup', function() { 
                if (isDragging) { isDragging = false; petImg.src = (walkDirection === -1) ? imgStandL : imgStandR; } 
            });
        });
        // 🎬 全自動雙向擁抱導演系統（標準非簡寫版）
        function triggerHugEvent() {
            isHuggingGlobal = true;
            
            const firstPet = activePets[0];
            const secondPet = activePets[1];
            
            let midX = (firstPet.data.getX() + secondPet.data.getX()) / 2 + 0; 
            let midY = (firstPet.data.getY() + secondPet.data.getY()) / 2;
            
            firstPet.data.setHide(true);
            secondPet.data.setHide(true);
            
            hugStage.style.left = midX + 'px';
            hugStage.style.top = midY + 'px';
            hugStage.style.display = 'block';
            
            let prefix = '';
            if (Math.random() < 0.5) {
                prefix = '';
            } else {
                prefix = 'r_';
            }
            
            setTimeout(function() { hugImg.src = prefix + 'meet1_face.png'; }, 0);       
            setTimeout(function() { hugImg.src = prefix + 'meet2_walk.png'; }, 1000);    
            setTimeout(function() { 
                hugImg.src = prefix + 'meet3_hug.png';                             
                spawnHeart(hugStage, 'Takumi');                            
                spawnHeart(hugStage, 'Aotsuki');
            }, 2200);
            setTimeout(function() { hugImg.src = prefix + 'meet4_separate.png'; }, 4200); 
            setTimeout(() => { hugImg.src = prefix + 'meet5_shy.png'; }, 5400);     
            
            // 互動結束，解散！
            setTimeout(function() {
                hugStage.style.display = 'none';
                
                // 強制將隱形座標拉回原地，徹底解決位移問題！
                firstPet.data.setX(midX - 40);
                secondPet.data.setX(midX + 160);
                firstPet.data.setY(midY);
                secondPet.data.setY(midY);
                
                firstPet.data.resetState();
                secondPet.data.resetState();
                firstPet.data.setHide(false);
                secondPet.data.setHide(false);
                
                isHuggingGlobal = false; 
            }, 7000);
        }

        function checkImageExists(url, success, error) {
            const img = new Image(); 
            img.onload = success; 
            img.onerror = error; 
            img.src = url;
        }

        function spawnHeart(parentContainer, folder) {
            const heart = document.createElement('img');
            heart.src = folder + '/heart.png'; 
            heart.className = 'heart-effect';
            heart.style.left = (Math.random() * 160 + 40) + 'px'; 
            heart.style.top = '40px'; 
            checkImageExists(heart.src, function() {
                parentContainer.appendChild(heart);
                setTimeout(function() { heart.remove(); }, 1200);
            }, function() {
                // 找不到愛心圖不處理，不彈破圖
            });
        }
    </script>
</body>
</html>
