<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>雙人桌寵動態實驗室 - 終極完美修正版</title>
    <style>
        body { margin: 0; overflow: hidden; background: transparent; }
        .pet-container { position: absolute; width: 128px; height: 128px; z-index: 10; }
        .hug-container { position: absolute; width: 256px; height: 128px; z-index: 20; display: none; aspect-ratio: auto; }
        .pet-img { width: auto; height: 100%; cursor: grab; user-select: none; }
        .pet-img:active { cursor: grabbing; }
        .heart-effect { position: absolute; width: 32px; height: 32px; pointer-events: none; animation: floatUp 1.2s ease-out forwards; }
        @keyframes floatUp { 0% { transform: translateY(0) scale(0.6); opacity: 0; } 20% { opacity: 1; } 100% { transform: translateY(-60px) scale(1.1); opacity: 0; } }
    </style>
</head>
<body>
    <div id="hug-stage" class="hug-container"><img id="hug-img" class="pet-img" src="meet1_face.png" alt="擁抱"></div>
    <script>
        const petsData = [{ folder: 'Takumi', sleepBreaths: 12 }, { folder: 'Aotsuki', sleepBreaths: 6 }];
        const activePets = []; const hugStage = document.getElementById('hug-stage'); const hugImg = document.getElementById('hug-img'); let isHuggingGlobal = false;

        petsData.forEach((cfg, idx) => {
            const f = cfg.folder; const maxSB = cfg.sleepBreaths;
            const div = document.createElement('div'); div.className = 'pet-container';
            const img = document.createElement('img'); img.className = 'pet-img'; img.alt = f; div.appendChild(img); document.body.appendChild(div);

            let sL = `${f}/shime1.png`, sR = `${f}/shime1_r.png`, dg = `${f}/drag.png`;
            let wkL = [`${f}/shime2.png`, `${f}/shime3.png`], wkR = [`${f}/shime2_r.png`, `${f}/shime3_r.png`];
            let sIn = `${f}/sit_in.png`, sOut = `${f}/sit_out.png`, sUp = `${f}/stand_up.png`;
            let spD = `${f}/sleep_down.png`, spIn = `${f}/sleep_in.png`, spOut = `${f}/sleep_out.png`, spUp = `${f}/sleep_up.png`;
            
            let isD = false, sX, sY, pX = 100 + (idx * 300), pY = 200, fIdx = 0, dir = idx === 0 ? 1 : -1, state = 'walk', bCnt = 0;

            img.src = sL; div.style.left = pX + 'px'; div.style.top = pY + 'px';
            activePets.push({ div, img, data: { getX:()=>pX, setX:(v)=>{pX=v;div.style.left=v+'px';}, getY:()=>pY, setY:(v)=>{pY=v;div.style.top=v+'px';}, getIsD:()=>isD, setH:(h)=>{div.style.display=h?'none':'block';}, rst:()=>{state='walk';} } });

            setInterval(() => {
                if (isD || isHuggingGlobal) return;
                if (state === 'walk') {
                    if (Math.random() < 0.8) {
                        if (Math.random() < 0.15) dir = dir === -1 ? 1 : -1; pX += dir * 12;
                        if (pX < 0) { pX = 0; dir = 1; } if (pX > window.innerWidth - 128) { pX = window.innerWidth - 128; dir = -1; }
                        div.style.left = pX + 'px'; fIdx = (fIdx + 1) % wkL.length;
                        if (dir === -1) { chk(wkL[fIdx], ()=>{img.src=wkL[fIdx];}, ()=>{img.src=sL;}); } else { chk(wkR[fIdx], ()=>{img.src=wkR[fIdx];}, ()=>{img.src=sR;}); }
                        img.style.transform = 'none';
                        if (idx === 0 && activePets.length === 2) {
                            let dist = Math.abs(activePets[0].data.getX() - activePets[1].data.getX());
                            if (dist < 100 && !activePets[0].data.getIsD() && !activePets[1].data.getIsD() && Math.random() < 0.4) triggerHugEvent();
                        }
                    } else {
                        if (Math.random() < 0.25) { if (Math.random() < 0.5) { state = 'rest_sit'; bCnt = 0; chk(sIn, ()=>{img.src=sIn;}, ()=>{img.src=sL;}); } else { state = 'rest_sleep'; bCnt = 0; chk(spD, ()=>{img.src=spD;}, ()=>{img.src=sL;}); } } 
                        else { if (dir === -1) { chk(sL, ()=>{img.src=sL;}, ()=>{img.src=sL;}); } else { chk(sR, ()=>{img.src=sR;}, ()=>{img.src=sR;}); } img.style.transform = 'none'; }
                    }
                }
                else if (state === 'rest_sit') {
                    if (bCnt < 6) { if (bCnt % 2 === 0) { chk(sOut, ()=>{img.src=sOut;}, ()=>{img.src=sL;}); } else { chk(sIn, ()=>{img.src=sIn;}, ()=>{img.src=sL;}); } bCnt++; } 
                    else { state = 'get_up'; chk(sUp, ()=>{img.src=sUp;}, ()=>{img.src=sL;}); }
                }
                else if (state === 'rest_sleep') {
                    if (bCnt === 0) { chk(spD, ()=>{img.src=spD;}, ()=>{img.src=sL;}); bCnt++; } 
                    else if (bCnt <= maxSB) { if (bCnt % 2 === 0) { chk(spOut, ()=>{img.src=spOut;}, ()=>{img.src=sL;}); } else { chk(spIn, ()=>{img.src=spIn;}, ()=>{img.src=sL;}); bCnt++; } 
                    else { state = 'wake_up'; chk(spUp, ()=>{img.src=spUp;}, ()=>{img.src=sL;}); }
                }
                else if (state === 'get_up' || state === 'wake_up') { state = 'walk'; img.src = (dir === -1) ? sL : sR; }
            }, 400);

            img.addEventListener('mousedown', (e) => {
                if (isHuggingGlobal) return; isD = true; state = 'walk';
                chk(dg, ()=>{img.src=dg;}, ()=>{img.src=(dir===-1?wkL[1]:wkR[1]);}); sX = e.clientX - pX; sY = e.clientY - pY; spH(div, f);
            });
            document.addEventListener('mousemove', (e) => { if (isD) { pX = e.clientX - sX; pY = e.clientY - sY; div.style.left = pX + 'px'; div.style.top = pY + 'px'; } });
            document.addEventListener('mouseup', () => { if (isD) { isD = false; img.src = sL; } });
        });

        function triggerHugEvent() {
            isHuggingGlobal = true; const p1 = activePets[0], p2 = activePets[1];
            let midX = (p1.data.getX() + p2.data.getX()) / 2 + 0, midY = (p1.data.getY() + p2.data.getY()) / 2;
            p1.data.setH(true); p2.data.setH(true); hugStage.style.left = midX + 'px'; hugStage.style.top = midY + 'px'; hugStage.style.display = 'block';
            const pf = Math.random() < 0.5 ? '' : 'r_';
            setTimeout(() => { hugImg.src = pf + 'meet1_face.png'; }, 0);
            setTimeout(() => { hugImg.src = pf + 'meet2_walk.png'; }, 1000);
            setTimeout(() => { hugImg.src = pf + 'meet3_hug.png'; spH(hugStage, 'Takumi'); spH(hugStage, 'Aotsuki'); }, 2200);
            setTimeout(() => { hugImg.src = pf + 'meet4_separate.png'; }, 4200);
            setTimeout(() => { hugImg.src = pf + 'meet5_shy.png'; }, 5400);
            setTimeout(() => {
                hugStage.style.display = 'none'; p1.data.setX(midX - 40); p2.data.setX(midX + 160); p1.data.setY(midY); p2.data.setY(midY);
                p1.data.rst(); p2.data.rst(); p1.data.setH(false); p2.data.setH(false); isHuggingGlobal = false;
            }, 7000);
        }
        function chk(u, s, e) { const i = new Image(); i.onload = s; i.onerror = e; i.src = u; }
        function spH(p, f) { const h = document.createElement('img'); h.src = `${f}/heart.png`; h.className = 'heart-effect'; h.style.left = (Math.random() * 160 + 40) + 'px'; h.style.top = '40px'; chk(h.src, ()=>{p.appendChild(h);setTimeout(()=>{h.remove();},1200);}, ()=>{}); }
    </script>
</body>
</html>
