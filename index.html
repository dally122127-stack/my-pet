<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>雙人桌寵動態實驗室 - 終極大團圓完美版</title>
    <style>
        body { margin: 0; overflow: hidden; background: transparent; }
        .pet-container { position: absolute; width: 128px; height: 128px; z-index: 10; }
        .hug-container { position: absolute; width: 256px; height: 128px; z-index: 20; display: none; aspect-ratio: auto; }
        .pet-img { width: auto; height: 100%; cursor: grab; user-select: none; }
        .pet-img:active { cursor: grabbing; }
        .heart-effect {
            position: absolute; width: 32px; height: 32px;
            pointer-events: none; animation: floatUp 1.2s ease-out forwards;
        }
        @keyframes floatUp {
            0% { transform: translateY(0) scale(0.6); opacity: 0; }
            20% { opacity: 1; }
            100% { transform: translateY(-60px) scale(1.1); opacity: 0; }
        }
    </style>
</head>
<body>

    <!-- 建立隱藏的雙人合體互動舞台 -->
    <div id="hug-stage" class="hug-container">
        <img id="hug-img" class="pet-img" src="meet1_face.png" alt="擁抱互動">
    </div>

    <script>
        const petsData = [
            { folder: 'Takumi', sleepBreaths: 18 },
            { folder: 'Aotsuki', sleepBreaths: 6 }
        ];
        const activePets = [];
        const hugStage = document.getElementById('hug-stage');
        const hugImg = document.getElementById('hug-img');
        let isHuggingGlobal = false;

        petsData.forEach(function(petConfig, index) {
            const folderName = petConfig.folder;
            const myMaxSleepBreaths = petConfig.sleepBreaths;

            const container = document.createElement('div');
            container.className = 'pet-container';
            const petImg = document.createElement('img');
            petImg.className = 'pet-img';
            petImg.alt = folderName;
            container.appendChild(petImg);
            document.body.appendChild(container);

            let imgStandL = folderName + '/shime1.png';
            let imgStandR = folderName + '/shime1_r.png';
            let imgDrag = folderName + '/drag.png'; 
            let walkFramesL = [folderName + '/shime2.png', folderName + '/shime3.png'];
            let walkFramesR = [folderName + '/shime2_r.png', folderName + '/shime3_r.png'];
            let imgSitIn = folderName + '/sit_in.png';
            let imgSitOut = folderName + '/sit_out.png';
            let imgSitInR = folderName + '/sit_in_r.png';
            let imgSitOutR = folderName + '/sit_out_r.png';
            let imgStandUp = folderName + '/stand_up.png';
            let imgSleepDown = folderName + '/sleep_down.png';
            let imgSleepIn = folderName + '/sleep_in.png';
            let imgSleepOut = folderName + '/sleep_out.png';
            let imgSleepUp = folderName + '/sleep_up.png';
            
            let isDragging = false; let startX = 0, startY = 0;
            let petObj = { x: 100 + (index * 300), y: 200 };
            let currentFrameIndex = 0; let walkDirection = (index === 0) ? 1 : -1;
            let petState = 'walk'; let breathCount = 0; const maxBreaths = 3;

            petImg.src = imgStandL;
            container.style.left = petObj.x + 'px'; container.style.top = petObj.y + 'px';

            activePets.push({
                container: container, petImg: petImg, pos: petObj,
                reset: function() { isDragging = false; petState = 'walk'; container.style.display = 'block'; }
            });

            setInterval(function() {
                if (isDragging || isHuggingGlobal) { return; }
                if (petState === 'walk') {
                    if (Math.random() < 0.8) { 
                        if (Math.random() < 0.15) { walkDirection = (walkDirection === -1) ? 1 : -1; }
                        petObj.x += walkDirection * 12;
                        if (petObj.x < 0) { petObj.x = 0; walkDirection = 1; }
                        if (petObj.x > window.innerWidth - 128) { petObj.x = window.innerWidth - 128; walkDirection = -1; }
                        container.style.left = petObj.x + 'px';
                        currentFrameIndex = (currentFrameIndex + 1) % walkFramesL.length;
                        if (walkDirection === -1) {
                            checkImageExists(walkFramesL[currentFrameIndex], function() { petImg.src = walkFramesL[currentFrameIndex]; }, function() { petImg.src = imgStandL; });
                        } else {
                            checkImageExists(walkFramesR[currentFrameIndex], function() { petImg.src = walkFramesR[currentFrameIndex]; }, function() { petImg.src = imgStandR; });
                        }
                        petImg.style.transform = 'none'; 
                        if (index === 0 && activePets.length === 2) {
                            let dist = Math.abs(activePets.pos.x - activePets.pos.x);
                            if (dist < 100 && Math.random() < 0.4) { triggerHugEvent(); }
                        }
                    } else {
                        if (Math.random() < 0.25) { 
                            if (Math.random() < 0.5) {
                                petState = 'rest_sit'; breathCount = 0;
                                let startSit = (walkDirection === -1) ? imgSitIn : imgSitInR;
                                let startSitBackup = (walkDirection === -1) ? imgStandL : imgStandR;
                                checkImageExists(startSit, function() { petImg.src = startSit; }, function() { petImg.src = startSitBackup; });
                            } else {
                                petState = 'rest_sleep'; breathCount = 0; checkImageExists(imgSleepDown, function() { petImg.src = imgSleepDown; }, function() { petImg.src = imgStandL; });
                            }
                        } else {
                            petImg.src = (walkDirection === -1) ? imgStandL : imgStandR; petImg.style.transform = 'none';
                        }
                    }
                }
                else if (petState === 'rest_sit') {
                    if (breathCount < maxBreaths * 2) {
                        let curSitIn = (walkDirection === -1) ? imgSitIn : imgSitInR;
                        let curSitOut = (walkDirection === -1) ? imgSitOut : imgSitOutR;
                        let curSitBackup = (walkDirection === -1) ? imgStandL : imgStandR;
                        if (breathCount % 2 === 0) { checkImageExists(curSitOut, function() { petImg.src = curSitOut; }, function() { petImg.src = curSitBackup; }); } 
                        else { checkImageExists(curSitIn, function() { petImg.src = curSitIn; }, function() { petImg.src = curSitBackup; }); }
                        breathCount++;
                    } else { petState = 'get_up'; checkImageExists(imgStandUp, function() { petImg.src = imgStandUp; }, function() { petImg.src = imgStandL; }); }
                }
                else if (petState === 'rest_sleep') {
                    if (breathCount === 0) { checkImageExists(imgSleepDown, function() { petImg.src = imgSleepDown; }, function() { petImg.src = imgStandL; }); breathCount++; } 
                    else if (breathCount <= myMaxSleepBreaths) {
                        if (breathCount % 2 === 0) { checkImageExists(imgSleepOut, function() { petImg.src = imgSleepOut; }, function() { petImg.src = imgStandL; }); } 
                        else { checkImageExists(imgSleepIn, function() { petImg.src = imgSleepIn; }, function() { petImg.src = imgStandL; }); }
                        breathCount++;
                    } else { petState = 'wake_up'; checkImageExists(imgSleepUp, function() { petImg.src = imgSleepUp; }, function() { petImg.src = imgStandL; }); } 
                }
                else if (petState === 'get_up' || petState === 'wake_up') { petState = 'walk'; petImg.src = (walkDirection === -1) ? imgStandL : imgStandR; }
            }, 400);

            petImg.addEventListener('mousedown', function(e) {
                if (isHuggingGlobal) { return; }
                isDragging = true; petState = 'walk';
                chk(imgDrag, function() { petImg.src = imgDrag; }, function() { petImg.src = (walkDirection === -1) ? (folderName + '/shime3.png') : (folderName + '/shime3_r.png'); });
                startX = e.clientX - petObj.x; startY = e.clientY - petObj.y; spH(container, folderName);
            });
            document.addEventListener('mousemove', function(e) { if (isDragging) { petObj.x = e.clientX - startX; petObj.y = e.clientY - startY; container.style.left = petObj.x + 'px'; container.style.top = petObj.y + 'px'; } });
            document.addEventListener('mouseup', function() { if (isDragging) { isDragging = false; petImg.src = (walkDirection === -1) ? imgStandL : imgStandR; } });
        });
        function triggerHugEvent() {
            isHuggingGlobal = true;
            const p1 = activePets.slice(0, 1).pop();
            const p2 = activePets.slice(1, 2).pop();
            
            let midX = (p1.pos.x + p2.pos.x) / 2 + 0; 
            let midY = (p1.pos.y + p2.pos.y) / 2;
            
            p1.container.style.display = 'none';
            p2.container.style.display = 'none';
            
            hugStage.style.left = midX + 'px'; hugStage.style.top = midY + 'px';
            hugStage.style.display = 'block';
            
            let prefix = (Math.random() < 0.5) ? '' : 'r_';
            
            setTimeout(function() { hugImg.src = prefix + 'meet1_face.png'; }, 0);       
            setTimeout(function() { hugImg.src = prefix + 'meet2_walk.png'; }, 1000);    
            setTimeout(function() { 
                hugImg.src = prefix + 'meet3_hug.png';                             
                spH(hugStage, 'Takumi'); spH(hugStage, 'Aotsuki');
            }, 2200);
            setTimeout(function() { hugImg.src = prefix + 'meet4_separate.png'; }, 4200); 
            setTimeout(function() { hugImg.src = prefix + 'meet5_shy.png'; }, 5400);     
            
            setTimeout(function() {
                hugStage.style.display = 'none';
                
                // 🎯 核心修復：直接對主螢幕坐標進行硬性對齊，徹底消滅位移
                p1.pos.x = midX - 40;
                p1.container.style.left = p1.pos.x + 'px';
                p1.pos.y = midY;
                p1.container.style.top = p1.pos.y + 'px';
                
                p2.pos.x = midX + 160;
                p2.container.style.left = p2.pos.x + 'px';
                p2.pos.y = midY;
                p2.container.style.top = p2.pos.y + 'px';
                
                p1.reset();
                p2.reset();
                isHuggingGlobal = false; 
            }, 7000);
        }

        function checkImageExists(url, success, error) { const img = new Image(); img.onload = success; img.onerror = error; img.src = url; }
        function chk(u, s, e) { checkImageExists(u, s, e); }
        function spH(p, f) {
            const h = document.createElement('img'); h.src = f + '/heart.png'; h.className = 'heart-effect';
            h.style.left = (Math.random() * 160 + 40) + 'px'; h.style.top = '40px'; 
            checkImageExists(h.src, function() { p.appendChild(h); setTimeout(function() { h.remove(); }, 1200); }, function() {});
        }
    </script>
</body>
</html>
