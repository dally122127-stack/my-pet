<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>雙人桌寵動態實驗室 - 發呆修復版</title>
    <style>
        body { margin: 0; overflow: hidden; background: transparent; }
        .pet-container { position: absolute; width: 128px; height: 128px; z-index: 10; }
        .hug-container { position: absolute; width: 256px; height: 128px; z-index: 20; display: none; aspect-ratio: auto; }
        .pet-img { width: auto; height: 100%; cursor: grab; user-select: none; }
        .pet-img:active { cursor: grabbing; }
        .heart-effect {
            position: absolute; width: 32px; height: 32px;
            pointer-events: none; animation: floatUp 1.2s ease-out forwards;
        }
        @keyframes floatUp {
            0% { transform: translateY(0) scale(0.6); opacity: 0; }
            20% { opacity: 1; }
            100% { transform: translateY(-60px) scale(1.1); opacity: 0; }
        }
    </style>
</head>
<body>

    <!-- 雙人合體互動舞台 -->
    <div id="hug-stage" class="hug-container">
        <img id="hug-img" class="pet-img" src="meet1_face.png" alt="擁抱互動">
    </div>

    <!-- 實體角色 HTML 結構 -->
    <div id="pet-id-0" class="pet-container"><img id="img-0" class="pet-img" src="Takumi/shime1.png" alt="Takumi"></div>
    <div id="pet-id-1" class="pet-container"><img id="img-1" class="pet-img" src="Aotsuki/shime1.png" alt="Aotsuki"></div>

    <script>
        window.onload = function() {
            
        const hugStage = document.getElementById('hug-stage');
        const hugImg = document.getElementById('hug-img');
        let isHuggingGlobal = false;

        // 全域核心記憶體
        let pX0 = 100, pY0 = 200, pState0 = 'walk', isD0 = false, dir0 = 1, fIdx0 = 0, bCnt0 = 0;
        let pX1 = 500, pY1 = 200, pState1 = 'walk', isD1 = false, dir1 = -1, fIdx1 = 0, bCnt1 = 0;

        const el0 = document.getElementById('pet-id-0'); const img0 = document.getElementById('img-0');
        const el1 = document.getElementById('pet-id-1'); const img1 = document.getElementById('img-1');

        el0.style.left = pX0 + 'px'; el0.style.top = pY0 + 'px';
        el1.style.left = pX1 + 'px'; el1.style.top = pY1 + 'px';
        // ⏱️ 全網頁唯一大時鐘控制核心
        setInterval(function() {
            if (isHuggingGlobal) { return; }

            // ====== 🤖 角色 0 (Takumi) 控制區 ======
            if (!isD0) {
                if (pState0 === 'walk') {
                    if (Math.random() < 0.8) {
                        if (Math.random() < 0.15) { dir0 = (dir0 === -1) ? 1 : -1; }
                        pX0 += dir0 * 12;
                        if (pX0 < 0) { pX0 = 0; dir0 = 1; } if (pX0 > window.innerWidth - 128) { pX0 = window.innerWidth - 128; dir0 = -1; }
                        el0.style.left = pX0 + 'px';
                        fIdx0 = (fIdx0 + 1) % 2;
                        let wk0 = (dir0 === -1) ? ['Takumi/shime2.png', 'Takumi/shime3.png'] : ['Takumi/shime2_r.png', 'Takumi/shime3_r.png'];
                        let stand0 = (dir0 === -1) ? 'Takumi/shime1.png' : 'Takumi/shime1_r.png';
                        checkImageExists(wk0[fIdx0], function() { img0.src = wk0[fIdx0]; }, function() { img0.src = stand0; });
                        
                        let dist = Math.abs(pX0 - pX1);
                        if (dist < 100 && !isD0 && !isD1) { triggerHugEvent(); }
                    } else {
                        if (Math.random() < 0.3) {
                            pState0 = 'smile_breath'; bCnt0 = 0;
                            img0.src = (dir0 === -1) ? 'Takumi/smile_in.png' : 'Takumi/smile_in_r.png';
                        } else if (Math.random() < 0.4) {
                            if (Math.random() < 0.5) { pState0 = 'rest_sit'; bCnt0 = 0; let sit0 = (dir0 === -1) ? 'Takumi/sit_in.png' : 'Takumi/sit_in_r.png'; img0.src = sit0; } 
                            else { pState0 = 'rest_sleep'; bCnt0 = 0; img0.src = 'Takumi/sleep_down.png'; }
                        } else { 
                            // ✨ 完美修復：拔除 _alt 尾巴，隨機 100% 都安全指向原來的 shime1 發呆姿勢
                            img0.src = (dir0 === -1) ? 'Takumi/shime1.png' : 'Takumi/shime1_r.png';
                        }
                    }
                }
                else if (pState0 === 'smile_breath') {
                    let sIn0 = (dir0 === -1) ? 'Takumi/smile_in.png' : 'Takumi/smile_in_r.png'; let sOut0 = (dir0 === -1) ? 'Takumi/smile_out.png' : 'Takumi/smile_out_r.png';
                    if (bCnt0 < 6) { img0.src = (bCnt0 % 2 === 0) ? sOut0 : sIn0; bCnt0++; } 
                    else {
                        pState0 = 'walk';
                        img0.src = (dir0 === -1) ? 'Takumi/shime1.png' : 'Takumi/shime1_r.png';
                    }
                }
                else if (pState0 === 'rest_sit') {
                    if (bCnt0 < 6) {
                        let sIn = (dir0 === -1) ? 'Takumi/sit_in.png' : 'Takumi/sit_in_r.png'; let sOut = (dir0 === -1) ? 'Takumi/sit_out.png' : 'Takumi/sit_out_r.png';
                        img0.src = (bCnt0 % 2 === 0) ? sOut : sIn; bCnt0++;
                    } else { pState0 = 'get_up'; img0.src = 'Takumi/stand_up.png'; }
                }
                else if (pState0 === 'rest_sleep') {
                    let spD0 = (dir0 === -1) ? 'Takumi/sleep_down.png' : 'Takumi/sleep_down_r.png'; let spIn0 = (dir0 === -1) ? 'Takumi/sleep_in.png' : 'Takumi/sleep_in_r.png';
                    let spOut0 = (dir0 === -1) ? 'Takumi/sleep_out.png' : 'Takumi/sleep_out_r.png'; let spUp0 = (dir0 === -1) ? 'Takumi/sleep_up.png' : 'Takumi/sleep_up_r.png';
                    if (bCnt0 === 0) { img0.src = spD0; bCnt0++; } else if (bCnt0 <= 12) { img0.src = (bCnt0 % 2 === 0) ? spOut0 : spIn0; bCnt0++; } else { pState0 = 'wake_up'; img0.src = spUp0; }
                }
                else if (pState0 === 'get_up' || pState0 === 'wake_up') { pState0 = 'walk'; img0.src = (dir0 === -1) ? 'Takumi/shime1.png' : 'Takumi/shime1_r.png'; }
            }

            // ====== 🤖 角色 1 (Aotsuki) 控制區 ======
            if (!isD1) {
                if (pState1 === 'walk') {
                    if (Math.random() < 0.8) {
                        if (Math.random() < 0.15) { dir1 = (dir1 === -1) ? 1 : -1; }
                        pX1 += dir1 * 12;
                        if (pX1 < 0) { pX1 = 0; dir1 = 1; } if (pX1 > window.innerWidth - 128) { pX1 = window.innerWidth - 128; dir1 = -1; }
                        el1.style.left = pX1 + 'px';
                        fIdx1 = (fIdx1 + 1) % 2;
                        let wk1 = (dir1 === -1) ? ['Aotsuki/shime2.png', 'Aotsuki/shime3.png'] : ['Aotsuki/shime2_r.png', 'Aotsuki/shime3_r.png'];
                        let stand1 = (dir1 === -1) ? 'Aotsuki/shime1.png' : 'Aotsuki/shime1_r.png';
                        checkImageExists(wk1[fIdx1], function() { img1.src = wk1[fIdx1]; }, function() { img1.src = stand1; });
                    } else {
                        if (Math.random() < 0.3) {
                            pState1 = 'smile_breath'; bCnt1 = 0;
                            img1.src = (dir1 === -1) ? 'Aotsuki/smile_in.png' : 'Aotsuki/smile_in_r.png';
                        } else if (Math.random() < 0.4) {
                            if (Math.random() < 0.5) { pState1 = 'rest_sit'; bCnt1 = 0; let sit1 = (dir1 === -1) ? 'Aotsuki/sit_in.png' : 'Aotsuki/sit_in_r.png'; img1.src = sit1; } 
                            else { pState1 = 'rest_sleep'; bCnt1 = 0; img1.src = 'Aotsuki/sleep_down.png'; }
                        } else { 
                            // ✨ 完美修復：Aotsuki 同步安全改回經典的 shime1 發呆姿勢
                            img1.src = (dir1 === -1) ? 'Aotsuki/shime1.png' : 'Aotsuki/shime1_r.png';
                        }
                    }
                }
                else if (pState1 === 'smile_breath') {
                    let sIn1 = (dir1 === -1) ? 'Aotsuki/smile_in.png' : 'Aotsuki/smile_in_r.png'; let sOut1 = (dir1 === -1) ? 'Aotsuki/smile_out.png' : 'Aotsuki/smile_out_r.png';
                    if (bCnt1 < 6) { img1.src = (bCnt1 % 2 === 0) ? sOut1 : sIn1; bCnt1++; } 
                    else {
                        pState1 = 'walk';
                        img1.src = (dir1 === -1) ? 'Aotsuki/shime1.png' : 'Aotsuki/shime1_r.png';
                    }
                }
                else if (pState1 === 'rest_sit') {
                    if (bCnt1 < 6) {
                        let sIn = (dir1 === -1) ? 'Aotsuki/sit_in.png' : 'Aotsuki/sit_in_r.png'; let sOut = (dir1 === -1) ? 'Aotsuki/sit_out.png' : 'Aotsuki/sit_out_r.png';
                        img1.src = (bCnt1 % 2 === 0) ? sOut : sIn; bCnt1++;
                    } else { pState1 = 'get_up'; img1.src = 'Aotsuki/stand_up.png'; }
                }
                else if (pState1 === 'rest_sleep') {
                    let spD1 = (dir1 === -1) ? 'Aotsuki/sleep_down.png' : 'Aotsuki/sleep_down_r.png'; let spIn1 = (dir1 === -1) ? 'Aotsuki/sleep_in.png' : 'Aotsuki/sleep_in_r.png';
                    let spOut1 = (dir1 === -1) ? 'Aotsuki/sleep_out.png' : 'Aotsuki/sleep_out_r.png'; let spUp1 = (dir1 === -1) ? 'Aotsuki/sleep_up.png' : 'Aotsuki/sleep_up_r.png';
                    if (bCnt1 === 0) { img1.src = spD1; bCnt1++; } else if (bCnt1 <= 6) { img1.src = (bCnt1 % 2 === 0) ? spOut1 : spIn1; bCnt1++; } else { pState1 = 'wake_up'; img1.src = spUp1; }
                }
                else if (pState1 === 'get_up' || pState1 === 'wake_up') { pState1 = 'walk'; img1.src = (dir1 === -1) ? 'Aotsuki/shime1.png' : 'Aotsuki/shime1_r.png'; }
            }
        }, 400);
        // 滑鼠抓取互動 - 角色 0
        let startX0 = 0, startY0 = 0;
        img0.addEventListener('mousedown', function(e) {
            if (isHuggingGlobal) return; isD0 = true; pState0 = 'walk';
            let drag0 = (dir0 === -1) ? 'Takumi/shime3.png' : 'Takumi/shime3_r.png';
            checkImageExists('Takumi/drag.png', function() { img0.src = 'Takumi/drag.png'; }, function() { img0.src = drag0; });
            startX0 = e.clientX - pX0; startY0 = e.clientY - pY0; spawnHeart(el0, 'Takumi');
        });
        document.addEventListener('mousemove', function(e) { if (isD0) { pX0 = e.clientX - startX0; pY0 = e.clientY - startY0; el0.style.left = pX0 + 'px'; el0.style.top = pY0 + 'px'; } });
        document.addEventListener('mouseup', function() { if (isD0) { isD0 = false; img0.src = (dir0 === -1) ? 'Takumi/shime1.png' : 'Takumi/shime1_r.png'; } });

        // 滑鼠抓取互動 - 角色 1
        let startX1 = 0, startY1 = 0;
        img1.addEventListener('mousedown', function(e) {
            if (isHuggingGlobal) return; isD1 = true; pState1 = 'walk';
            let drag1 = (dir1 === -1) ? 'Aotsuki/shime3.png' : 'Aotsuki/shime3_r.png';
            checkImageExists('Aotsuki/drag.png', function() { img1.src = 'Aotsuki/drag.png'; }, function() { img1.src = drag1; });
            startX1 = e.clientX - pX1; startY1 = e.clientY - pY1; spawnHeart(el1, 'Aotsuki');
        });
        document.addEventListener('mousemove', function(e) { if (isD1) { pX1 = e.clientX - startX1; pY1 = e.clientY - startY1; el1.style.left = pX1 + 'px'; el1.style.top = pY1 + 'px'; } });
        document.addEventListener('mouseup', function() { if (isD1) { isD1 = false; img1.src = (dir1 === -1) ? 'Aotsuki/shime1.png' : 'Aotsuki/shime1_r.png'; } });

        // 🎬 全自動雙向擁抱導演系統
        function triggerHugEvent() {
            isHuggingGlobal = true;
            let midX = (pX0 + pX1) / 2; let midY = (pY0 + pY1) / 2;
            
            el0.style.display = 'none'; el1.style.display = 'none';
            hugStage.style.left = midX + 'px'; hugStage.style.top = midY + 'px'; hugStage.style.display = 'block';
            
            let prefix = (Math.random() < 0.5) ? '' : 'r_';
            
            setTimeout(function() { hugImg.src = prefix + 'meet1_face.png'; }, 0);       
            setTimeout(function() { hugImg.src = prefix + 'meet2_walk.png'; }, 1000);    
            setTimeout(function() { hugImg.src = prefix + 'meet3_hug.png'; spawnHeart(hugStage, 'Takumi'); spawnHeart(hugStage, 'Aotsuki'); }, 2200);
            setTimeout(function() { hugImg.src = prefix + 'meet4_separate.png'; }, 4200); 
            setTimeout(function() { hugImg.src = prefix + 'meet5_shy.png'; }, 5400);     
            
            setTimeout(function() {
                hugStage.style.display = 'none';
                
                pX0 = midX - 40; pY0 = midY;
                pX1 = midX + 160; pY1 = midY;
                
                el0.style.left = pX0 + 'px'; el0.style.top = pY0 + 'px'; el0.style.display = 'block';
                el1.style.left = pX1 + 'px'; el1.style.top = pY1 + 'px'; el1.style.display = 'block';
                
                img0.src = (dir0 === -1) ? 'Takumi/shime1.png' : 'Takumi/shime1_r.png';
                img1.src = (dir1 === -1) ? 'Aotsuki/shime1.png' : 'Aotsuki/shime1_r.png';

                pState0 = 'walk'; pState1 = 'walk';
                isHuggingGlobal = false; 
            }, 7000);
        }

        function checkImageExists(url, success, error) { const img = new Image(); img.onload = success; img.onerror = error; img.src = url; }
        function spawnHeart(parentContainer, folder) {
            const heart = document.createElement('img'); heart.src = folder + '/heart.png'; heart.className = 'heart-effect';
            heart.style.left = (Math.random() * 160 + 40) + 'px'; heart.style.top = '40px'; 
            checkImageExists(heart.src, function() { parentContainer.appendChild(heart); setTimeout(function() { heart.remove(); }, 1200); }, function() {});
        }

        }; // 🔒 window.onload 結尾
    </script>
</body>
</html>
